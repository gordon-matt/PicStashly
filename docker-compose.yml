services:
  app:
    build:
      context: .
      dockerfile: PicStashly/Dockerfile
    container_name: picstashly
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Default: SQLite stored in the mounted data folder — zero configuration.
      FileStorage__BasePath: /app/data/media
      # Database__Provider: Sqlite
      # ConnectionStrings__DefaultConnection: Data Source=/app/data/picstashly.db
      # To use PostgreSQL instead, comment the two lines above and uncomment:
      Database__Provider: Npgsql
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=picstashly;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
      # ── Authentication (optional) ────────────────────────────────────────────
      # By default the app uses its built-in ASP.NET Core Identity (local admin account,
      # see SeedAdmin__Email / SeedAdmin__Password below). To use Keycloak for centralised
      # login instead, set Authentication__Provider to "Keycloak" and fill in Authority +
      # ClientSecret (uncomment the "keycloak" service below too). See docs/KEYCLOAK_SETUP.md.
      SeedAdmin__Email: admin@example.com
      SeedAdmin__Password: Admin@123!
      Authentication__Provider: Keycloak
      Authentication__Keycloak__Authority: http://host.docker.internal:8081/realms/home
      Authentication__Keycloak__ClientId: picstashly
      Authentication__Keycloak__ClientSecret: "m9fDEFUoWov0027JhPQvxwUhGtFp5qOZ"
    volumes:
      - D:/_Docker/picstashly/uploads:/app/data
    depends_on:
      db:
        condition: service_healthy
      
  db:
    image: postgres:18-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: picstashly
    volumes:
      # Postgres 18+ expects mount at /var/lib/postgresql (image uses versioned subdir inside it)
      # Host path must exist; ensure D: is in Docker Desktop → Settings → Resources → File sharing
      - D:/_Docker/picstashly/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional Keycloak — uncomment together with the Authentication__Keycloak__* settings above.
  # After first start, open http://localhost:8081 and follow docs/KEYCLOAK_SETUP.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: keycloak
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
      # Persist realm/user data across restarts:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    command: start-dev
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s